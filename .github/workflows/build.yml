name: Build and release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
          cache-dependency-path: |
            go.sum
            vendor/modules.txt
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/buildinfo/version.go)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match installer version $version" >&2
            exit 1
          fi
          printf 'directory=dist/v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: make check
      - name: Check bootstrap with BusyBox
        run: |
          if ! command -v busybox >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y busybox
          fi
          busybox sh -n onekvm.sh
          GOWORK=off GOFLAGS=-mod=vendor go test -count=1 -run TestBootstrapBusyBox ./internal/bootstrap
      - run: make package
      - name: Verify packages
        env:
          RELEASE_DIR: ${{ steps.version.outputs.directory }}
        run: |
          cd "$RELEASE_DIR"
          sha256sum -c SHA256SUMS
          ../onekvm-installer-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: onekvm-installer
          path: ${{ steps.version.outputs.directory }}/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onekvm-installer
          path: release
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd release
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "OneKVM Installer $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./SHA256SUMS ./onekvm.sh --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest
          fi
